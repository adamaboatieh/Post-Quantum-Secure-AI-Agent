[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "post-quantum-secure-ai-agent"
version = "1.0.0"
description = "Research prototype for classical and post-quantum authentication of AI-agent actions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50.0.0,<51",
]

[project.scripts]
pqsa-demo = "agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*", "policy*", "signing*", "tools*", "server*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
